  // 쓰는 곳 — 상품명에 이런 말이 있으면 위로 (거르지는 않는다)
  var USES = [
    [/카페|매장|업소|사무실|가게|식당|영업용|업무용|회사/, "업소·사무실용", ["업소", "사무실", "대용량", "영업", "업무", "카페"]],
    [/원룸|자취|1인|혼자|소형|미니|작은|좁은/, "작은 공간용", ["미니", "소형", "슬림", "컴팩트", "1인", "원룸"]],
    [/대가족|대형|큰\s|대용량/, "대용량", ["대용량", "대형"]]
  ];
  // 상품을 가리지 않는 말 — 낱말 단위로 뺀다 (조사는 먼저 뗀다)
  var STOP = {};
  ("렌탈 구독 추천 찾아줘 찾아 주세요 알려줘 보여줘 해줘 원해 원해요 있나요 있어요 좋은 괜찮은 제일 가장 저렴한 저렴하게 싼 싸게 최저 최저가 가성비 " +
   "쓸만한 쓸 사용할 쓸거 우리집 집 좀 그리고 월 원 이하 이상 미만 정도 개월 약정 카드 할인 부모님 어머니 아버지 엄마 아빠 선물 상품 제품 가전 " +
   "모델 싶어요 싶은 할 하는 살 사고 필요해 필요한 거 것 뭐 어떤 요즘 인기 인기있는 많이 쓰는 새로 새 신혼 이사 아무거나 아무 대충 그냥 " +
   "사이즈 크기 용량 렌탈사 업체 회사 브랜드 상담").split(" ").forEach(function (w) { STOP[w] = 1; });
  var JOSA = /(에서|으로|에게|이랑|하고|짜리|용으로|용|은|는|이|가|을|를|에|로|도|만|요)$/;

  var DATA = null, COS = [], state = { q: "", sort: "rec", shown: 24, drop: {} };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var won = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };
  var norm = function (s) { return String(s || "").toLowerCase().replace(/\s+/g, ""); };

  // ---- 말 → 조건
  function parse(q) {
    var t = " " + q.toLowerCase() + " ", c = { tokens: [], cats: [], feats: [] };
    // 렌탈사 → 제조사 → 기능 → 품목 순 (LG헬로비전을 LG로, 맥북을 노트북 품목으로만 먼저 잡지 않게)
    COS.forEach(function (co) { var lc = co.toLowerCase(); if (!c.co && co.length >= 3 && t.indexOf(lc) >= 0) { c.co = co; t = t.split(lc).join(" "); } });
    MAKERS.some(function (mk) { return mk[1].some(function (w) { if (t.indexOf(w) >= 0) { c.maker = mk; if (w !== "맥북") t = t.split(w).join(" "); return true; } }); });
    FEATS.forEach(function (f) { var m = t.match(f[0]); if (m) { c.feats.push(f); if (!f[3]) t = t.replace(m[0], " "); } });
    CATS.forEach(function (ct) { var m = t.match(ct[0]); if (m) { c.cats.push(ct); t = t.replace(m[0], " "); } });
    c.feats.forEach(function (f) { if (f[3]) t = t.replace(f[0], " "); });  // 품목을 알아들은 뒤 남은 기능 말 지우기 (얼음정수기 → '얼음' 두 번 안 나오게)
    var b = t.match(/(\d+(?:\.\d+)?)\s*만\s*(?:원)?\s*(대|이하|미만|아래|까지|안쪽|이내|정도|쯤|내외|이상|넘는)?/) || t.match(/(\d{4,6})\s*원\s*(대|이하|미만|아래|까지|안쪽|이내|정도|쯤|내외|이상)?/);
    if (b) {
      var v = /만/.test(b[0]) ? Math.round(parseFloat(b[1]) * 10000) : parseInt(b[1], 10), how = b[2] || "이하";
      if (how === "대") c.budget = { min: v, max: v + 9999, label: "월 " + won(v / 10000) + "만 원대" };
      else if (/정도|쯤|내외/.test(how)) c.budget = { min: Math.round(v * 0.8), max: Math.round(v * 1.2), label: "월 " + won(v) + "원 안팎" };
      else if (/이상|넘는/.test(how)) c.budget = { min: v, max: 1e9, label: "월 " + won(v) + "원 이상" };
      else c.budget = { min: 0, max: how === "미만" ? v - 1 : v, label: "월 " + won(v) + "원 " + (how === "미만" ? "미만" : "이하") };
      c.budget.card = /카드/.test(t);
      t = t.replace(b[0], " ");
    }
    var mo = t.match(/(\d{2})\s*개월/), yr = t.match(/(\d)\s*년/);
    if (mo) { c.months = +mo[1]; t = t.replace(mo[0], " "); } else if (yr) { c.months = +yr[1] * 12; t = t.replace(yr[0], " "); }
    var inch = t.match(/(\d{2,3})\s*(인치|형)/); if (inch) { c.inch = inch[1]; t = t.replace(inch[0], " "); }
    var py = t.match(/(\d{1,2})\s*평/); if (py) { c.py = py[1]; t = t.replace(py[0], " "); }
    c.uses = [];
    USES.forEach(function (u) { var m = t.match(u[0]); if (m) { c.uses.push(u); t = t.replace(m[0], " "); } });
    if (/저렴|싼|싸게|최저|가성비/.test(q)) c.cheap = true;
    t.split(/[\s,·/]+/).forEach(function (w) {
      w = w.replace(/[^\w가-힣+-]/g, "");
      if (STOP[w]) return;
      w = w.replace(JOSA, "");
      if (w.length >= 2 && !/^\d/.test(w) && !STOP[w] && c.tokens.indexOf(w) < 0) c.tokens.push(w);
    });
    return c;
  }

  // ---- 조건 → 상품
  function search(c) {
    var out = [];
    for (var i = 0; i < DATA.length; i++) {
      var r = DATA[i], name = norm(r[1] + " " + r[2]), sp = " " + (r[1] + " " + r[2]).toLowerCase() + " ", s = 0;
      var liveCats = c.cats.filter(function (ct, k) { return !state.drop["cat" + k]; });
      if (liveCats.length && !liveCats.some(function (ct) { return ct[1].indexOf(r[3]) >= 0; })) continue;
      var featOk = c.feats.every(function (f, k) { return state.drop["feat" + k] || f[2].some(function (w) { return w.indexOf(" ") >= 0 || w.indexOf("(") >= 0 ? sp.indexOf(w) >= 0 : name.indexOf(norm(w)) >= 0; }); });
      if (!featOk) continue;
      if (c.feats.length) s += 2;
      if (c.maker && !state.drop.maker && !c.maker[1].some(function (w) { return norm(r[4]).indexOf(w) >= 0 || name.indexOf(w) >= 0; })) continue;
      if (c.co && !state.drop.co && r[5] !== c.co) continue;
      // 약정을 말하면 그 기간 요금으로 보여 주고 예산도 그 요금으로 거른다
      var fee = r[6], cd = r[8], mo = r[7];
      if (c.months && !state.drop.months) {
        var tm = (r[11] || []).filter(function (x) { return x[0] === c.months; })[0];
        if (!tm) continue;
        fee = tm[1]; cd = tm[2]; mo = tm[0];
      }
      if (c.budget && !state.drop.budget) { var f = c.budget.card && cd ? cd : fee; if (f < c.budget.min || f > c.budget.max) continue; }
      if (c.inch && !state.drop.inch) { if (name.indexOf(c.inch + "인치") < 0 && name.indexOf(c.inch + "형") < 0 && name.indexOf(c.inch) < 0) continue; s += 5; }
      if (c.py && !state.drop.py) { if (name.indexOf(c.py + "평") < 0) continue; s += 5; }
      c.uses.forEach(function (u, k) { if (state.drop["use" + k]) return; if (u[2].some(function (w) { return name.indexOf(norm(w)) >= 0; })) s += 3; });
      var hit = 0;
      c.tokens.forEach(function (w, k) { if (state.drop["tok" + k]) return; if (name.indexOf(norm(w)) >= 0 || norm(r[3]).indexOf(norm(w)) >= 0) { hit++; s += 4; } });
      var liveTok = c.tokens.filter(function (w, k) { return !state.drop["tok" + k]; }).length;
      if (!liveCats.length && liveTok && !hit) continue;     // 품목을 못 알아들었으면 남은 낱말이 하나는 맞아야
      s += Math.min(r[10], 5) * 0.4;                 // 렌탈사가 많을수록 비교할 게 많다
      if (cd) s += 0.5;
      out.push({ s: s, r: r, fee: fee, card: cd, mo: mo });
    }
    var by = state.sort === "rec" && !c.cheap
      ? function (a, b) { return b.s - a.s || a.fee - b.fee; }
      : state.sort === "card" ? function (a, b) { return ((a.card || a.fee) - (b.card || b.fee)) || a.fee - b.fee; }
      : function (a, b) { return a.fee - b.fee; };
    return out.sort(by);
  }

  // ---- 그리기
  function chipsHTML(c) {
    var h = [], add = function (k, label, soft) { h.push('<span class="fd-chip' + (soft ? " soft" : "") + '">' + esc(label) + '<button type="button" data-drop="' + k + '" aria-label="' + esc(label) + ' 빼기">×</button></span>'); };
    c.cats.forEach(function (ct, k) { if (!state.drop["cat" + k]) add("cat" + k, ct[2]); });
    c.feats.forEach(function (f, k) { if (!state.drop["feat" + k]) add("feat" + k, f[1]); });
    if (c.maker && !state.drop.maker) add("maker", c.maker[0]);
    if (c.co && !state.drop.co) add("co", c.co + " 렌탈");
    if (c.budget && !state.drop.budget) add("budget", (c.budget.card ? "카드 할인 시 " : "") + c.budget.label);
    if (c.months && !state.drop.months) add("months", c.months + "개월 약정");
    if (c.inch && !state.drop.inch) add("inch", c.inch + "인치");
    if (c.py && !state.drop.py) add("py", c.py + "평");
    c.uses.forEach(function (u, k) { if (!state.drop["use" + k]) add("use" + k, u[1], true); });
    c.tokens.forEach(function (w, k) { if (!state.drop["tok" + k]) add("tok" + k, "‘" + w + "’ 포함", true); });
    if (c.cheap) h.push('<span class="fd-chip soft">낮은 요금 먼저</span>');
    return h.length ? '<span class="lb">이렇게 찾았어요</span>' + h.join("") : "";
  }
  function card(x) {
    var r = x.r, href = "/detail.html?item=" + encodeURIComponent(r[0]);
    return '<article class="fd-card">' +
      '<a class="ph" href="' + href + '">' + (r[9] ? '<img loading="lazy" src="/' + esc(r[9]) + '" alt="' + esc(r[1]) + '">' : "") +
        (r[10] > 1 ? '<span class="co">렌탈사 ' + r[10] + '곳 비교</span>' : '<span class="co">' + esc(r[5]) + '</span>') + '</a>' +
      '<div class="bd"><span class="mk">' + esc(r[4] || r[5]) + '</span>' +
      '<a class="nm" href="' + href + '">' + esc(r[1]) + '</a>' +
      (r[2] ? '<span class="md">' + esc(r[2]) + '</span>' : "") +
      '<div class="pr"><small>월</small><b>' + won(x.fee) + '원</b>' + (x.mo ? '<em>' + x.mo + '개월</em>' : "") + '</div>' +
      (x.card ? '<div class="cd">카드 할인 시 ' + won(x.card) + '원 <small>전월 실적 조건</small></div>' : "") +
      '<div class="bt"><a href="' + href + '">자세히</a><button type="button" data-ask="' + esc(r[0]) + '">상담 신청</button></div></div></article>';
  }
  function render() {
    var q = state.q.trim();
    if (!q) {
      $("#fdGot").innerHTML = "";
      $("#fdOut").innerHTML = '<div class="fd-start"><b>이렇게 적어 보세요</b>품목만 적어도 되고, 예산·기간·브랜드를 붙이면 더 좁혀 드려요.' +
        '<div class="cats">' + ["정수기", "안마의자", "로봇청소기", "공기청정기", "냉장고", "TV", "세탁기", "노트북"].map(function (x) { return '<button type="button" data-q="' + x + '">' + x + '</button>'; }).join("") + '</div></div>';
      return;
    }
    var c = parse(q);
    if (!c.cats.length && !c.feats.length && !c.maker && !c.co && !c.budget && !c.months && !c.inch && !c.py && !c.uses.length && !c.tokens.length) {
      $("#fdGot").innerHTML = "";
      $("#fdOut").innerHTML = '<div class="fd-start"><b>어떤 가전인지 알아듣지 못했어요</b>품목 이름을 넣어 다시 적어 주세요. 예) 정수기, 안마의자 월 5만 원 이하' +
        '<div class="cats">' + ["정수기", "안마의자", "로봇청소기", "공기청정기", "냉장고", "TV", "세탁기", "노트북"].map(function (x) { return '<button type="button" data-q="' + x + '">' + x + '</button>'; }).join("") + '</div></div>';
      return;
    }
    var list = search(c);
    $("#fdGot").innerHTML = chipsHTML(c);
    if (!list.length) {
      // 어느 조건을 빼면 나오는지 — 예산·약정·기능 순으로 하나씩 빼 보고 알려 준다
      var tries = [];
      if (c.budget && !state.drop.budget) tries.push(["budget", "예산 빼고"]);
      if (c.months && !state.drop.months) tries.push(["months", "약정 기간 빼고"]);
      c.feats.forEach(function (f, k) { if (!state.drop["feat" + k]) tries.push(["feat" + k, "‘" + f[1] + "’ 빼고"]); });
      if (c.maker && !state.drop.maker) tries.push(["maker", c.maker[0] + " 빼고"]);
      var sug = tries.map(function (tr) { state.drop[tr[0]] = 1; var n = search(c).length; delete state.drop[tr[0]]; return [tr, n]; })
        .filter(function (x) { return x[1] > 0; }).slice(0, 3);
      $("#fdOut").innerHTML = '<div class="fd-empty"><b>이 조건에 딱 맞는 상품은 없어요</b>' +
        (sug.length ? '조건을 하나 빼면 이만큼 있어요.<div class="cats">' + sug.map(function (x) {
          return '<button type="button" data-drop="' + x[0][0] + '">' + esc(x[0][1]) + ' 보기 (' + won(x[1]) + '개)</button>'; }).join("") + '</div>'
          : '조건만 남겨 주시면 담당자가 직접 찾아 드려요.') +
        '<br><button type="button" class="cta" id="fdAskQ"><i class="fas fa-headset"></i> 이 조건으로 찾아 달라고 하기</button></div>';
      return;
    }
    var sortBar = '<div class="fd-bar"><div class="fd-count">맞는 상품 <b>' + won(list.length) + '</b>개</div>' +
      '<div class="fd-sort" role="tablist">' + [["rec", "추천순"], ["fee", "낮은 요금순"], ["card", "카드 할인순"]].map(function (s) {
        return '<button type="button" data-sort="' + s[0] + '" class="' + (state.sort === s[0] ? "on" : "") + '">' + s[1] + '</button>'; }).join("") + '</div></div>';
    $("#fdOut").innerHTML = sortBar + '<div class="fd-grid">' + list.slice(0, state.shown).map(card).join("") + '</div>' +
      (list.length > state.shown ? '<button type="button" class="fd-more" id="fdMore">더 보기 (' + won(list.length - state.shown) + '개 남음)</button>' : "");
    state.list = list;
  }
  function go(q) {
    state.q = q; state.shown = 24; state.drop = {}; state.sort = "rec";
    $("#fdQ").value = q;
    try { history.replaceState(null, "", q ? "?q=" + encodeURIComponent(q) : location.pathname); } catch (e) {}
    if (DATA) render();
  }

  // ---- 이벤트
  $("#fdForm").addEventListener("submit", function (e) { e.preventDefault(); go($("#fdQ").value); $("#fdQ").blur(); });
  var EX = ["카페에서 쓸 얼음정수기 월 3만 원 이하", "부모님 안마의자 60개월", "원룸 세탁기 2만원대", "LG 65인치 TV", "로봇청소기 물걸레 저렴한 거", "삼성 김치냉장고"];
  $("#fdEx").innerHTML = EX.map(function (x) { return '<button type="button" data-q="' + esc(x) + '">' + esc(x) + '</button>'; }).join("");
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-q],[data-drop],[data-sort],[data-ask],#fdMore,#fdAskQ");
    if (!t) return;
    if (t.dataset.q) return go(t.dataset.q);
    if (t.dataset.drop) { state.drop[t.dataset.drop] = 1; state.shown = 24; return render(); }
    if (t.dataset.sort) { state.sort = t.dataset.sort; state.shown = 24; return render(); }
    if (t.id === "fdMore") { state.shown += 24; return render(); }
    if (t.id === "fdAskQ") { if (window.RM_OPEN) window.RM_OPEN({ kind: state.q, from: "말로 찾기(맞는 상품 없음) · " + state.q }); return; }
    if (t.dataset.ask) {
      var x = (state.list || []).filter(function (y) { return y.r[0] === t.dataset.ask; })[0];
      if (x && window.RM_OPEN) window.RM_OPEN({ item: { ItemNo: x.r[0], ItemName: x.r[1], ModelName: x.r[2], RentalFee: String(x.fee), DutyUsePeriod: x.mo ? String(x.mo) : "", BrandName: x.r[5] }, from: "말로 찾기 · " + state.q });
    }
  });

  // ---- 시작
  var q0 = (location.search.match(/[?&]q=([^&]*)/) || [])[1];
  $("#fdQ").value = q0 ? decodeURIComponent(q0.replace(/\+/g, " ")) : "";
  state.q = $("#fdQ").value;
  fetch("/rm/data/find.json?v=202610271936").then(function (r) { return r.json(); }).then(function (d) {
    DATA = d;
    var seen = {}; d.forEach(function (r) { if (r[5]) seen[r[5]] = 1; }); COS = Object.keys(seen);
    render();
  }).catch(function () {
    $("#fdOut").innerHTML = '<div class="fd-empty"><b>상품 목록을 불러오지 못했어요</b>잠시 뒤 다시 열어 주시거나 카톡으로 물어봐 주세요.</div>';
  });
})();
</script>
