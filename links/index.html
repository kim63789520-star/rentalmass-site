<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#193c49">
<title>사이트 모음 | 렌탈매스</title>
<meta name="description" content="가전결합 멤버십 · 생활가전 렌탈 · 보장 점검 상담 사이트 모음">
<meta property="og:title" content="사이트 모음">
<meta property="og:description" content="가전결합 멤버십 · 생활가전 렌탈 · 보장 점검 상담">
<meta property="og:image" content="https://rentalmass.co.kr/img/130519.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<style>
/* 쇼룸 톤 — 본 사이트와 같은 흰 바탕 + 네이비 한 색 */
:root{
  --paper:#ffffff; --mist:#eef1f4; --line:#dde1e6;
  --ink:#1a2332; --muted:#5b6573; --navy:#193c49; --navy-deep:#122d37; --on-navy:#cfdee1;
  --serif:"MaruBuriBold","MaruBuri","Noto Serif KR",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

.hero{background:var(--navy);color:#fff;padding:44px 20px 72px;text-align:center;
  background-image:radial-gradient(120% 80% at 50% 0%,#24556a 0%,var(--navy) 60%,var(--navy-deep) 100%)}
.hero .badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--on-navy);
  border:1px solid rgba(207,222,225,.35);border-radius:999px;padding:5px 12px;margin-bottom:16px}
.hero h1{font-family:var(--serif);font-size:28px;line-height:1.35;margin:0 0 10px}
.hero p{margin:0;color:var(--on-navy);font-size:15px}

.wrap{max-width:520px;margin:-44px auto 0;padding:0 16px 40px;position:relative}
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:26px 4px 10px}
.label:first-child{margin-top:0;color:var(--on-navy)}

.card{display:block;background:var(--paper);border-radius:16px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(18,45,55,.06),0 6px 20px rgba(18,45,55,.07);transition:transform .15s,box-shadow .15s}
.card:hover{box-shadow:0 2px 4px rgba(18,45,55,.08),0 10px 28px rgba(18,45,55,.12)}
.card:active{transform:scale(.985)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.thumbs img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;padding:10px}
.body{display:flex;align-items:center;gap:12px;padding:16px 18px}
.body .txt{flex:1;min-width:0}
.body strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy)}
.body span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.go{flex:none;display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:#fff;
  font-size:13px;font-weight:700;border-radius:999px;padding:9px 14px}

.icons{display:flex;justify-content:space-around;padding:22px 12px 18px;background:#f7f9fa;border-bottom:1px solid var(--line)}
.icons div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.icons svg{width:30px;height:30px;stroke:var(--navy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.photo{position:relative;height:170px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 72%}

.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<header class="hero">
  <div class="badge">RENTALMASS</div>
  <h1>상담해 주셔서<br>감사합니다</h1>
  <p>궁금하신 곳을 눌러 편하게 둘러보세요</p>
</header>

<main class="wrap">
  <p class="label">가전결합 멤버십</p>

  <a class="card" href="/">
    <div class="thumbs">
      <img src="/img/130519.jpg" alt="" loading="lazy">
      <img src="/img/139437.jpg" alt="" loading="lazy">
      <img src="/img/144306.jpg" alt="" loading="lazy">
    </div>
    <div class="body">
      <div class="txt"><strong>가전 전액지원 멤버십</strong><span>가전은 지금 · 조건 충족 시 만기 환급</span></div>
      <div class="go">보기 ›</div>
    </div>
  </a>

  <a class="card" href="/sono/">
    <div class="thumbs">
      <img src="/sono/img/6148947.jpg" alt="" loading="lazy">
      <img src="/sono/img/6174752.jpg" alt="" loading="lazy">
      <img src="/sono/img/6174897.jpg" alt="" loading="lazy">
    </div>
    <div class="body">
      <div class="txt"><strong>가전 멤버십</strong><span>180회 납입 · 20회 거치 · 조건 충족 시 환급</span></div>
      <div class="go">보기 ›</div>
    </div>
  </a>

  <p class="label">생활가전 렌탈</p>

  <a class="card" href="https://rentalmass.shop/">
    <div class="icons" aria-hidden="true">
      <div><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>정수기</div>
      <div><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M9 8h6M9 11h6M9 14h6"/></svg>공기청정기</div>
      <div><svg viewBox="0 0 24 24"><path d="M7 4h4a2 2 0 0 1 2 2v7h5a2 2 0 0 1 2 2v2H9a2 2 0 0 1-2-2z"/><path d="M8 17l-2 4M18 17l1 4"/></svg>안마의자</div>
      <div><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6h2"/></svg>생활가전</div>
    </div>
    <div class="body">
      <div class="txt"><strong>렌탈매스</strong><span>정수기 · 공기청정기 · 안마의자 렌탈</span></div>
      <div class="go">보기 ›</div>
    </div>
  </a>

  <p class="label">보험</p>

  <a class="card" href="/bohum/">
    <div class="photo"><img src="/bohum/img/care.jpg" alt="" loading="lazy"></div>
    <div class="body">
      <div class="txt"><strong>같은 보장, 다른 조건</strong><span>보장 점검 상담</span></div>
      <div class="go">보기 ›</div>
    </div>
  </a>

  <p class="foot">rentalmass.co.kr</p>
</main>
</body>
</html>
