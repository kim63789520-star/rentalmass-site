<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다혜 비서 — 통합 사이트 & 시스템 허브</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --bg: #0b0f19;
  --bg-card: #131b2e;
  --bg-card-hover: #182238;
  --bg-sub: #1a243b;
  --border: #23314f;
  --border-focus: #3b82f6;
  --fg: #f1f5f9;
  --fg-muted: #94a3b8;
  --fg-sub: #cbd5e1;
  --primary: #3b82f6;
  --primary-glow: rgba(59, 130, 246, 0.15);
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.12);
  --emerald: #10b981;
  --emerald-bg: rgba(16, 185, 129, 0.12);
  --purple: #8b5cf6;
  --purple-bg: rgba(139, 92, 246, 0.12);
  --rose: #f43f5e;
  --rose-bg: rgba(244, 63, 94, 0.12);
  --cyan: #06b6d4;
  --cyan-bg: rgba(6, 182, 212, 0.12);
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --bg-card-hover: #f1f5f9;
  --bg-sub: #f1f5f9;
  --border: #e2e8f0;
  --border-focus: #2563eb;
  --fg: #0f172a;
  --fg-muted: #64748b;
  --fg-sub: #334155;
  --primary: #2563eb;
  --primary-glow: rgba(37, 99, 235, 0.08);
  --gold: #d97706;
  --gold-bg: rgba(217, 119, 6, 0.1);
  --emerald: #059669;
  --emerald-bg: rgba(5, 150, 105, 0.1);
  --purple: #7c3aed;
  --purple-bg: rgba(124, 58, 237, 0.1);
  --rose: #e11d48;
  --rose-bg: rgba(225, 29, 72, 0.1);
  --cyan: #0891b2;
  --cyan-bg: rgba(8, 145, 178, 0.1);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 32px 20px 80px;
}

.container {
  max-width: 1320px;
  margin: 0 auto;
}

/* Header */
.header {
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.header-title-box h1 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  word-break: keep-all;
}
.header-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-glow);
  border: 1px solid var(--border-focus);
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.04em;
}
.header-desc {
  color: var(--fg-muted);
  font-size: 14px;
  margin-top: 6px;
}

/* Tools Bar */
.top-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}
.theme-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-muted);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.theme-btn:hover {
  color: var(--fg);
  border-color: var(--fg-muted);
}

/* Stats Ribbon */
.stats-ribbon {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stat-card .label {
  font-size: 12px;
  color: var(--fg-muted);
  font-weight: 600;
}
.stat-card .val {
  font-size: 20px;
  font-weight: 800;
  color: var(--fg);
}

/* Search & Filter */
.control-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 28px;
}
.search-wrapper {
  position: relative;
  width: 100%;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-muted);
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px 14px 44px;
  color: var(--fg);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
}
.search-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.search-input::placeholder {
  color: var(--fg-muted);
}

.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-muted);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.tab-btn:hover {
  color: var(--fg);
  border-color: var(--fg-muted);
}
.tab-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
}
.tab-btn .badge-count {
  font-size: 11px;
  background: rgba(255, 255, 255, 0.2);
  padding: 1px 6px;
  border-radius: 999px;
}
.tab-btn:not(.active) .badge-count {
  background: var(--bg-sub);
  color: var(--fg-muted);
}

/* Grid Layout */
.site-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
  gap: 16px;
}

/* Card Component */
.site-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  position: relative;
  overflow: hidden;
}
.site-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--card-accent, var(--primary));
}
.site-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-focus);
  box-shadow: var(--shadow);
}

/* Card Header */
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}
.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tag-live { color: var(--emerald); background: var(--emerald-bg); border: 1px solid rgba(16, 185, 129, 0.3); }
.tag-new { color: var(--gold); background: var(--gold-bg); border: 1px solid rgba(245, 158, 11, 0.3); }
.tag-admin { color: var(--rose); background: var(--rose-bg); border: 1px solid rgba(244, 63, 94, 0.3); }
.tag-ad { color: var(--cyan); background: var(--cyan-bg); border: 1px solid rgba(6, 182, 212, 0.3); }
.tag-cat { color: var(--fg-muted); background: var(--bg-sub); }

.card-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.35;
  margin-bottom: 4px;
}
.card-tagline {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 12px;
}

/* Detail Box: 한눈에 알아보기 */
.preview-box {
  background: var(--bg-sub);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
  border: 1px solid rgba(255, 255, 255, 0.04);
}
.preview-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--fg-sub);
  margin-bottom: 6px;
  line-height: 1.45;
}
.preview-item:last-child {
  margin-bottom: 0;
}
.preview-item .icon-bullet {
  flex-shrink: 0;
  font-weight: 700;
  color: var(--card-accent, var(--primary));
  font-size: 12px;
  margin-top: 1px;
}
.preview-item strong {
  color: var(--fg);
  font-weight: 600;
  flex-shrink: 0;
}

/* Card Bottom */
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  gap: 8px;
}
.url-text {
  font-size: 12px;
  color: var(--fg-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 220px;
}
.card-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.action-btn {
  background: var(--bg-sub);
  border: 1px solid var(--border);
  color: var(--fg-sub);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}
.action-btn:hover {
  background: var(--bg-card-hover);
  color: var(--fg);
  border-color: var(--border-focus);
}
.action-btn.visit {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.action-btn.visit:hover {
  opacity: 0.9;
  box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1e293b;
  color: #fff;
  border: 1px solid var(--primary);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1000;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Empty State */
.empty-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-muted);
  font-size: 15px;
  grid-column: 1 / -1;
}

@media (max-width: 640px) {
  body { padding: 20px 14px 60px; }
  .site-grid { grid-template-columns: 1fr; }
  .header-title-box h1 { font-size: 21px; }
  .url-text { max-width: 140px; }
}
</style>
</head>
<body>

</div>

let currentFilter = 'all';
let searchQuery = '';

function renderSites() {
  const grid = document.getElementById('siteGrid');
  grid.innerHTML = '';

  const q = searchQuery.trim().toLowerCase();
  const filtered = SITES.filter(s => {
    // Category Filter
    if (currentFilter !== 'all' && s.category !== currentFilter) return false;
    // Search Query
    if (!q) return true;
    const matchName = s.name.toLowerCase().includes(q);
    const matchTagline = s.tagline.toLowerCase().includes(q);
    const matchUrl = s.url.toLowerCase().includes(q);
    const matchFeatures = s.features.some(f => f.k.toLowerCase().includes(q) || f.v.toLowerCase().includes(q));
    const matchTags = s.tags.some(t => t.text.toLowerCase().includes(q));
    return matchName || matchTagline || matchUrl || matchFeatures || matchTags;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-msg">🔍 '${escapeHtml(q)}' 검색 결과와 일치하는 사이트가 없습니다.</div>`;
    return;
  }

  filtered.forEach(site => {
    const card = document.createElement('div');
    card.className = 'site-card';
    card.style.setProperty('--card-accent', site.accent);

    const tagsHtml = site.tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join('');
    const featuresHtml = site.features.map(f => `
      <div class="preview-item">
        <span class="icon-bullet">▶</span>
        <strong>${f.k}:</strong>
        <span>${escapeHtml(f.v)}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="card-tags">${tagsHtml}</div>
        </div>
        <h2 class="card-title">${site.name}</h2>
        <p class="card-tagline">${site.tagline}</p>

        <div class="preview-box">
          ${featuresHtml}
        </div>
      </div>

      <div class="card-bottom">
        <span class="url-text" title="${site.url}">${site.displayUrl}</span>
        <div class="card-actions">
          <button class="action-btn" onclick="copyUrl('${site.url}')" title="URL 주소 복사">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            복사
          </button>
          <a class="action-btn visit" href="${site.url}" target="_blank" rel="noopener">
            방문 ↗
          </a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value;
  renderSites();
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSites();
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast();
  }).catch(() => {
    const t = document.createElement('textarea');
    t.value = url;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    showToast();
  });
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeBtn(next);
}

function updateThemeBtn(theme) {
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  if (theme === 'dark') {
    icon.textContent = '☀️';
    text.textContent = '라이트모드';
  } else {
    icon.textContent = '🌙';
    text.textContent = '다크모드';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Initial Load
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtn(saved);
  renderSites();
});
</script>
