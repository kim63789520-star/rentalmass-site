<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>보험사 매니저 연락처</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 조작 — 위 고정 검색·탭, 아래 회사별 묶음 카드, 줄마다 큰 전화 버튼 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#17212b; --muted:#5d6b78; --line:#dde3e8;
  --son:#0f5f8c; --saeng:#1d7a52; --chong:#7a5a12; --call:#0f5f8c; --callink:#ffffff;
  --f-body:"Gothic A1",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --panel:#182027; --ink:#e6edf2; --muted:#93a3b0; --line:#26323c;
  --son:#5cb3e6; --saeng:#5fcf98; --chong:#e0b54f; --call:#2a7fb3; --callink:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --panel:#182027; --ink:#e6edf2; --muted:#93a3b0; --line:#26323c;
  --son:#5cb3e6; --saeng:#5fcf98; --chong:#e0b54f; --call:#2a7fb3; --callink:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:10px}
h1{margin:0;font-size:20px;font-weight:800;text-wrap:balance}
h1 small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
#q:focus{outline:2px solid var(--son);outline-offset:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.tabs button:focus-visible,.row a:focus-visible,.row button:focus-visible{outline:2px solid var(--son);outline-offset:2px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp h2{margin:0;padding:10px 14px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.grp h2 .kind{font-size:12px;font-weight:600;letter-spacing:.04em}
.k-son .kind{color:var(--son)} .k-saeng .kind{color:var(--saeng)} .k-chong .kind{color:var(--chong)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 14px}
.row+.row{border-top:1px dashed var(--line)}
.who{min-width:0}
.who b{font-weight:600}
.who .num{display:block;font-family:var(--f-num);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;user-select:all}
.row a.call{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--call);color:var(--callink);text-decoration:none;font-weight:800;font-size:15px;white-space:nowrap}
.row button.copy{font:inherit;font-size:13px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;color:var(--muted);padding:24px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
@media (max-width:380px){.row{grid-template-columns:1fr auto}.row button.copy{display:none}}
@media (prefers-reduced-motion:no-preference){.row a.call{transition:transform .1s}.row a.call:active{transform:scale(.97)}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<div class="wrap">
  <header>
    <h1>보험사 매니저 연락처 <small>누르면 전화 · 2026-10-27</small></h1>
    <input id="q" type="search" placeholder="회사·이름으로 찾기 (예: 메리츠, 흥국)" aria-label="회사나 이름으로 찾기" autocomplete="off">
    <div class="tabs" role="group" aria-label="구분">
      <button type="button" data-k="all" aria-pressed="true">전체</button>
      <button type="button" data-k="son" aria-pressed="false">손보 매니저</button>
      <button type="button" data-k="saeng" aria-pressed="false">생보 매니저</button>
      <button type="button" data-k="chong" aria-pressed="false">총무 (영업소)</button>
    </div>
  </header>
  <main id="list"></main>
  <p class="note">카카오톡 보이스톡은 번호로 바로 걸 수 없어요 — [복사]로 번호를 복사해 카톡 친구 추가(전화번호로 추가)에 붙여 넣으면 됩니다.</p>
</div>
<div id="toast" hidden></div>

<script>
const DATA = [
  // [구분, 회사, 이름·직함, 번호]
  ["son","DB손보","이채원 매니저","010-3160-3315"],

  ["son","메리츠","송리경 매니저","010-4217-5937"],
  ["son","한화손보","양승훈 교육실장","010-6703-0641"],
  ["son","삼성화재","오정은 매니저","010-4430-3693"],
  ["son","롯데손보","강원아 매니저","010-8188-2501"],
  ["son","흥국화재","이재황 매니저","010-2229-4885"],
  ["son","농협손보","이우혜 매니저","010-2340-3916"],
  ["son","하나손보","이윤혜 매니저","010-7110-9384"],
  ["son","라이나손보","최혜림 매니저","010-8188-9965"],
  ["son","라이나손보","김홍진 매니저","010-7637-5114"],
  ["son","AIG손보","오서영 매니저","010-7770-1841"],
  ["saeng","동양생명","정세림 매니저","010-8138-8746"],

  ["saeng","라이나","이지은 매니저","010-5089-5660"],
  ["saeng","라이나","박서진 매니저","010-5726-4136"],
  ["saeng","농협생명","이재은 교육실장","010-3492-2006"],
  ["saeng","DB생명","채정욱 교육실장","010-8814-7972"],
  ["saeng","삼성생명","박동성 매니저","010-6493-9353"],
  ["saeng","흥국생명","김지혜 매니저","010-6494-5531"],
  ["saeng","흥국생명","이병찬 매니저","010-4683-9587"],
  ["saeng","메트라이프","신하연 매니저","010-3387-0816"],
  ["saeng","신한생명","이정아 실장","010-9167-4029"],
  ["saeng","KDB생명","김향숙 과장","010-7409-6725"],
  ["saeng","한화생명","이선화 매니저","010-2402-7305"],
  ["saeng","KB라이프","이하늘 매니저","010-8956-4051"],
  ["saeng","미래에셋","유승호 매니저","010-9282-1645"],
  ["saeng","미래에셋","심은미 매니저","010-5513-0714"],
  ["saeng","AIA생명","이예나 매니저","010-7262-0210"],
  ["saeng","AIA생명","전유리 매니저","010-7612-4548"],
  ["saeng","ABL생명","문별 매니저","010-9550-2231"],
  ["saeng","하나생명","노미옥 매니저","010-5906-9934"],
  ["saeng","하나생명","정희진 매니저","010-5885-2613"],
  ["saeng","교보생명","한승희 매니저","010-4242-6126"],
  ["saeng","교보생명","오미정 매니저","010-3411-7669"],
  ["chong","KB손보","서정은 총무","042-259-3031"],
  ["chong","DB손보","이연호 총무","042-601-4731"],
  ["chong","메리츠","조예리 총무","042-530-7333"],
  ["chong","현대해상","조재희 총무","042-229-1732","~3번까지"],
  ["chong","한화손보","정덕실 총무","042-256-1004"],

  ["chong","롯데손보","정우인 총무","042-336-8882"],
  ["chong","흥국화재","오송이 총무","042-527-4294"],
  ["chong","농협손보","김미림 총무","044-279-4100"],
  ["chong","AIG손보","김새롬 총무","02-2260-7845"],
  ["chong","농협생명","김미영 총무","042-479-3307","~8번까지"],
  ["chong","흥국생명","민다운 총무","042-257-7289"],
  ["chong","DB생명","진정언 총무","042-482-4542"],
  ["chong","삼성생명","전병희 총무","042-472-1593"],
  ["chong","동양생명","김유숙 총무","042-523-9914"],
  ["chong","신한라이프","이선경 총무","02-3455-4103"],
  ["chong","KB라이프","길다혜 총무","1899-3800"],
  ["chong","ABL생명","GA지원센터","02-3787-8866"],
  ["chong","KDB생명","임벼리 총무","062-718-7994"],
  ["chong","교보생명","이은하 총무","042-472-1583"],
  ["chong","미래에셋","윤하영 총무","042-366-4551"],
  ["chong","한화생명","남경선 총무","042-330-7907"],
  ["chong","라이나","전지혜 총무","02-3775-7159"],
  ["chong","하나생명","홍지혜 총무","02-3709-7155"]
];
const KIND = {son:"손보 매니저", saeng:"생보 매니저", chong:"총무 · 영업소"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let kind = "all";
try { kind = localStorage.getItem("ins_kind") || "all"; } catch {}

function render(){
  const q = document.getElementById("q").value.trim().replace(/\s/g,"").toLowerCase();
  const rows = DATA.filter(r => (kind==="all" || r[0]===kind) &&
    (!q || (r[1]+r[2]+r[3]).replace(/\s/g,"").toLowerCase().includes(q)));
  const groups = [];
  rows.forEach(r => { const key = r[0]+"|"+r[1]; let g = groups.find(x=>x.key===key); if(!g){g={key,k:r[0],co:r[1],rows:[]};groups.push(g);} g.rows.push(r); });
  document.getElementById("list").innerHTML = groups.length ? groups.map(g => `
    <section class="grp k-${g.k}"><h2>${esc(g.co)}<span class="kind">${KIND[g.k]}</span></h2>
    ${g.rows.map(r => `<div class="row"><div class="who"><b>${esc(r[2])}</b><span class="num">${esc(r[3])}${r[4]?` · ${esc(r[4])}`:""}</span></div>
      <a class="call" href="tel:${r[3].replace(/[^0-9]/g,"")}" aria-label="${esc(r[1]+" "+r[2])} 전화">📞 전화</a>
      <button type="button" class="copy" data-n="${esc(r[3])}">복사</button></div>`).join("")}
    </section>`).join("") : `<p class="empty">"${esc(document.getElementById("q").value)}" 찾는 결과가 없어요</p>`;
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1600); }
document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".tabs button").forEach(b => {
  b.setAttribute("aria-pressed", String(b.dataset.k===kind));
  b.addEventListener("click", () => {
    kind = b.dataset.k;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
    try { localStorage.setItem("ins_kind", kind); } catch {}
    render();
  });
});
document.getElementById("list").addEventListener("click", async e => {
  const b = e.target.closest("button.copy"); if(!b) return;
  try { await navigator.clipboard.writeText(b.dataset.n); toast(b.dataset.n+" 복사했어요"); }
  catch { const s = b.closest(".row").querySelector(".num"); const r=document.createRange(); r.selectNodeContents(s); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("번호를 길게 눌러 복사하세요"); }
});
render();
</script>

</body></html>
