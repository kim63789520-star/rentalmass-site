<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>전화 연결</title>
<!-- 블로그 전화 이미지 → 여기 → 기록 남기고 바로 전화 (11-28 대표님 "어디서 전화 왔는지 확인").
     링크: https://rentalmass.co.kr/c/?f=<블로그계정>-<글날짜>  · 기록은 방문기록 시트 page='클릭:전화(블로그) <f>'
     번호 글자는 화면에 안 쓴다(보험 블로그 규칙). 이 파일은 build_site.py가 건드리지 않는다. -->
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mut:#6b7280;--blue:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#20242c;--ink:#eef0f4;--mut:#a3a9b5;--blue:#6f9bff}}
:root[data-theme="dark"]{--bg:#15181e;--card:#20242c;--ink:#eef0f4;--mut:#a3a9b5;--blue:#6f9bff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border-radius:20px;padding:32px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 8px} p{color:var(--mut);margin:0 0 24px;font-size:16px;line-height:1.5}
a.btn{display:block;background:var(--blue);color:#fff;text-decoration:none;font-size:20px;font-weight:700;padding:18px;border-radius:14px}
</style></head><body>
<div class="card"><h1>전화 연결 중입니다</h1><p>잠시 후 전화가 연결되지 않으면<br>아래 버튼을 눌러 주세요.</p>
<a class="btn" id="go" href="tel:01021657015">전화 걸기</a></div>
<script>
(function () {
  var TEL = "tel:01021657015";
  var RELAY = "https://script.google.com/macros/s/AKfycbzPiRuMQ0x3xVLYvB8nBHRTcAF5jetr6bpflzVI4V03divmkIv9EUDODWELyeOcYL7K/exec";
  var f = (new URLSearchParams(location.search).get("f") || "모름").replace(/[^\w가-힣.-]/g, "").slice(0, 60);
  var body = JSON.stringify({ site: location.host, page: "클릭:전화(블로그) " + f, q: location.search.slice(0, 400),
    ref: (document.referrer || "").slice(0, 300), ad: 0, ip: "", ua: navigator.userAgent.slice(0, 200) });
  var sent = false;
  try { sent = navigator.sendBeacon && navigator.sendBeacon(RELAY, new Blob([body], { type: "text/plain" })); } catch (e) {}
  if (!sent) try { fetch(RELAY, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: body }); } catch (e) {}
  // 모바일만 자동 연결 — PC에선 tel:이 아무 일도 안 하니 버튼만 둔다
  if (/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) setTimeout(function () { location.href = TEL; }, 300);
})();
</script>
</body></html>
